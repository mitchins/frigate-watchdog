name: Release

# Build once, qualify the exact published digest, then promote that digest.
#
#   source   -> lint, types, tests, tag/version agreement
#   build    -> multi-arch image pushed to a staging tag; digest recorded
#   qualify  -> amd64: pull by digest, runtime checks + container qualification
#   smoke    -> arm64: pull by digest, runtime checks
#   promote  -> retag the qualified digest; GitHub (pre-)release
#
# Git tags are v-prefixed; container tags are not. v0.1.0-rc.1 is promoted
# as 0.1.0-rc.1 only. A final v0.1.0 also receives 0.1.0, 0.1, 0 and latest.
# The tag must equal the package version (PEP 440 normalised), and the image
# must report that version at runtime.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source:
    name: qualify source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - name: Tag equals project version
        id: version
        run: |
          set -eu
          uv run python - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, sys, tomllib
          from packaging.version import Version
          project = Version(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          tag = Version(os.environ["GITHUB_REF_NAME"].removeprefix("v"))
          if tag != project:
              sys.exit(f"tag {os.environ['GITHUB_REF_NAME']} != pyproject version {project}")
          print(f"version={project}")
          EOF
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest tests/unit tests/protocol tests/integration --cov=frigate_watchdog --cov-branch --cov-fail-under=85

  build:
    name: build + push staging image
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image reference
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push (staging tag only)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.ref.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.source.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  qualify:
    name: qualify published image (amd64)
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      WATCHDOG_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      EXPECTED_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$WATCHDOG_IMAGE"
      - name: Image identity (runtime version, build revision)
        run: |
          set -eu
          docker run --rm -e EXPECTED_VERSION --entrypoint python "$WATCHDOG_IMAGE" -c \
            "import os; from frigate_watchdog import __version__ as v; assert v == os.environ['EXPECTED_VERSION'], v; print(v)"
          revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$WATCHDOG_IMAGE")"
          test "$revision" = "$GITHUB_SHA" || { echo "image revision $revision != $GITHUB_SHA" >&2; exit 1; }
      - name: Image starts and loads runtime
        run: |
          docker run --rm --entrypoint python "$WATCHDOG_IMAGE" -c \
            "from frigate_watchdog.onvif import DEVICE_WSDL; assert DEVICE_WSDL.exists()"
          docker run --rm --read-only --user 1000:1000 --tmpfs /tmp:size=16m \
            --entrypoint fwatch "$WATCHDOG_IMAGE" --help
      - name: No test fixtures in the image
        run: |
          if docker run --rm --entrypoint sh "$WATCHDOG_IMAGE" -c 'test -d /app/tests || test -d /repo/tests'; then
            echo "test fixtures must not ship in the release image" >&2
            exit 1
          fi
      - name: Container qualification against the published digest
        run: |
          mkdir -p tests/container/watchdog-data
          sudo chown -R 1000:1000 tests/container/watchdog-data
          docker compose -f tests/container/compose.test.yaml up \
            --abort-on-container-exit --exit-code-from qualify --build
        env:
          COMPOSE_PARALLEL_LIMIT: "4"

  smoke-arm64:
    name: smoke published image (arm64)
    needs: [source, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    env:
      WATCHDOG_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      EXPECTED_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$WATCHDOG_IMAGE"
      - run: |
          docker run --rm -e EXPECTED_VERSION --entrypoint python "$WATCHDOG_IMAGE" -c \
            "import os; from frigate_watchdog import __version__ as v; assert v == os.environ['EXPECTED_VERSION'], v; from frigate_watchdog.onvif import DEVICE_WSDL; assert DEVICE_WSDL.exists(); import aiohttp, zeep, yaml, aiomqtt, httpx"
          docker run --rm --entrypoint fwatch "$WATCHDOG_IMAGE" --help

  promote:
    name: promote qualified digest
    needs: [build, qualify, smoke-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the qualified digest
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          tags="${VERSION}"
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            tags="${tags} $(echo "$VERSION" | cut -d. -f1-2) $(echo "$VERSION" | cut -d. -f1) latest"
          fi
          set --
          for t in $tags; do set -- "$@" -t "${IMAGE}:${t}"; done
          docker buildx imagetools create "$@" "${IMAGE}@${DIGEST}"
          # Invariant: every promoted tag resolves to the qualified digest.
          for t in $tags; do
            got="$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$got" != "$DIGEST" ]; then
              echo "${IMAGE}:${t} resolves to ${got}, expected ${DIGEST}" >&2
              exit 1
            fi
            echo "${IMAGE}:${t} -> ${got}"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          notes="Image: \`${IMAGE}:${TAG#v}\`

          Digest: \`${IMAGE}@${DIGEST}\`

          This digest passed container qualification (amd64) and smoke (arm64) after being pulled from GHCR."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "$notes" --verify-tag $flags
