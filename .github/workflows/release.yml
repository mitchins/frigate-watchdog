name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  qualify:
    name: test the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - name: Tag, package, and runtime versions must agree
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          uv run python -c "
          import sys
          from frigate_watchdog import __version__
          expected = '${VERSION}'
          assert __version__ == expected, f'tag {expected} != package {__version__}'
          print(f'version agreement OK: {expected}')
          "
      - run: uv run pytest tests/unit tests/protocol tests/integration --cov=frigate_watchdog --cov-branch --cov-fail-under=85

  qualify-image:
    name: qualify the built image
    needs: qualify
    runs-on: ubuntu-24.04
    env:
      LOCAL_TAG: frigate-watchdog:release-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t "${LOCAL_TAG}" .
      - name: Runtime version must match the tag
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          out="$(docker run --rm --entrypoint fwatch "${LOCAL_TAG}" --version)"
          echo "${out}"
          echo "${out}" | grep -qx "fwatch ${VERSION}"
      - name: Container qualification (exact image that will be pushed)
        run: |
          mkdir -p tests/container/watchdog-data
          sudo chown -R 1000:1000 tests/container/watchdog-data
          WATCHDOG_IMAGE="${LOCAL_TAG}" docker compose -f tests/container/compose.test.yaml up \
            --abort-on-container-exit --exit-code-from qualify --build
        env:
          COMPOSE_PARALLEL_LIMIT: "4"

  publish:
    name: publish image
    needs: qualify-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            echo "${IMAGE}:${VERSION}"
            if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "${IMAGE}:$(echo "$VERSION" | cut -d. -f1)"
              echo "${IMAGE}:$(echo "$VERSION" | cut -d. -f1-2)"
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.tags.outputs.image }}
      version: ${{ steps.tags.outputs.version }}

  verify:
    name: verify the published digest
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull by digest and check runtime version
        run: |
          set -eu
          REF="${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}"
          echo "verifying ${REF}"
          docker pull "${REF}"
          out="$(docker run --rm --entrypoint fwatch "${REF}" --version)"
          echo "${out}"
          echo "${out}" | grep -qx "fwatch ${{ needs.publish.outputs.version }}"
          docker run --rm --entrypoint python "${REF}" -c \
            "from frigate_watchdog.onvif import DEVICE_WSDL; assert DEVICE_WSDL.exists()"
      - name: Container qualification against the published digest
        run: |
          mkdir -p tests/container/watchdog-data
          sudo chown -R 1000:1000 tests/container/watchdog-data
          WATCHDOG_IMAGE="${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}" \
            docker compose -f tests/container/compose.test.yaml up \
            --abort-on-container-exit --exit-code-from qualify --build
        env:
          COMPOSE_PARALLEL_LIMIT: "4"
