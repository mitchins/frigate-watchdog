name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: format, lint, types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy

  test:
    name: unit + protocol + integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/unit tests/protocol tests/integration --cov=frigate_watchdog --cov-branch --cov-report=term --cov-fail-under=85
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: build + container qualify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: frigate-watchdog:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts and loads runtime
        run: |
          docker run --rm --entrypoint python frigate-watchdog:local -c \
            "from frigate_watchdog.onvif import DEVICE_WSDL; from frigate_watchdog import __version__; assert DEVICE_WSDL.exists(); print(__version__)"
          docker run --rm --read-only --user 1000:1000 --tmpfs /tmp:size=16m \
            --entrypoint fwatch frigate-watchdog:local --help
      - name: No test fixtures in the image
        run: |
          if docker run --rm --entrypoint sh frigate-watchdog:local -c 'test -d /app/tests || test -d /repo/tests'; then
            echo "test fixtures must not ship in the release image" >&2
            exit 1
          fi
      - name: Container qualification
        run: |
          mkdir -p tests/container/watchdog-data
          sudo chown -R 1000:1000 tests/container/watchdog-data
          docker compose -f tests/container/compose.test.yaml up \
            --abort-on-container-exit --exit-code-from qualify --build
        env:
          COMPOSE_PARALLEL_LIMIT: "4"

  arm64-smoke:
    name: arm64 image starts
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: frigate-watchdog:local
      - run: |
          docker run --rm --entrypoint python frigate-watchdog:local -c \
            "from frigate_watchdog.onvif import DEVICE_WSDL; assert DEVICE_WSDL.exists(); import aiohttp, zeep, yaml, aiomqtt, httpx"
          docker run --rm --entrypoint fwatch frigate-watchdog:local --help
